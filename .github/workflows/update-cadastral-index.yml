name: update cadastral index

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gdal-bin jq

      - name: Build cadastral index
        run: ./scripts/update-cadastral-index.sh

      - name: Commit changed data
        run: |
          if git diff --quiet -- public/assets/katasteraemter-gemarkungen-fluren-nrw.json; then
            echo "No cadastral index changes."
            exit 0
          fi

          git config user.name "kvie-bot"
          git config user.email "open@kreis-viersen.de"

          git add public/assets/katasteraemter-gemarkungen-fluren-nrw.json
          git commit -m "Update cadastral index"
          git push